<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friday Films - Book Movie Tickets Online</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <nav class="navbar">
            <div class="nav-brand">
                <h2><i class="fas fa-film"></i> Friday Films</h2>
            </div>
            <div class="nav-search">
                <input type="text" id="searchInput" placeholder="Search for movies, events, sports..." class="search-bar">
                <button class="search-btn"><i class="fas fa-search"></i></button>
            </div>
            <div class="nav-actions">
                <button class="location-btn">
                    <i class="fas fa-map-marker-alt"></i>
                    <span id="currentCity">Vijayawada</span>
                    <i class="fas fa-chevron-down"></i>
                </button>
            </div>
        </nav>
    </header>

    <!-- Hero Slider -->
    <section class="hero-slider">
        <div class="slider-container">
            <div class="slide active">
                <div class="slide-content">
                    <h1>Avengers: Endgame</h1>
                    <p>Now Playing in IMAX 3D</p>
                    <button class="cta-btn">Book Tickets</button>
                </div>
            </div>
            <div class="slide">
                <div class="slide-content">
                    <h1>Dune: Part Two</h1>
                    <p>Experience the Epic Saga</p>
                    <button class="cta-btn">Book Tickets</button>
                </div>
            </div>
            <div class="slide">
                <div class="slide-content">
                    <h1>Spider-Man: No Way Home</h1>
                    <p>Final Swing in Theaters</p>
                    <button class="cta-btn">Book Tickets</button>
                </div>
            </div>
        </div>
        <div class="slider-nav">
            <button class="slider-prev"><i class="fas fa-chevron-left"></i></button>
            <button class="slider-next"><i class="fas fa-chevron-right"></i></button>
        </div>
    </section>

    <!-- Filters -->
    <section class="filters">
        <div class="container">
            <div class="filter-tabs">
                <button class="filter-tab active" data-filter="movies">Movies</button>
                <button class="filter-tab" data-filter="events">Events</button>
                <button class="filter-tab" data-filter="sports">Sports</button>
            </div>
            <div class="filter-group">
                <select id="dateFilter" class="filter-select">
                    <option>Today</option>
                    <option>Tomorrow</option>
                    <option>This Weekend</option>
                </select>
                <select id="languageFilter" class="filter-select">
                    <option>All Languages</option>
                    <option>Telugu</option>
                    <option>Hindi</option>
                    <option>English</option>
                    <option>Tamil</option>
                </select>
                <select id="genreFilter" class="filter-select">
                    <option>All Genres</option>
                    <option>Action</option>
                    <option>Drama</option>
                    <option>Comedy</option>
                    <option>Thriller</option>
                </select>
                <select id="priceFilter" class="filter-select">
                    <option>All Prices</option>
                    <option>₹100 - ₹200</option>
                    <option>₹200 - ₹400</option>
                    <option>₹400+</option>
                </select>
            </div>
        </div>
    </section>

    <!-- Movies Grid -->
    <section class="movies-grid">
        <div class="container">
            <div class="movies-container" id="moviesContainer">
                <!-- Movies will be populated by JavaScript -->
            </div>
        </div>
    </section>

    <!-- Movie Modal -->
    <div class="modal" id="movieModal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <div class="modal-body" id="modalBody">
                <!-- Dynamic content -->
            </div>
        </div>
    </div>

    <!-- Booking Modal -->
    <div class="modal" id="bookingModal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <div class="booking-content" id="bookingContent">
                <!-- Dynamic booking content -->
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
